# Lokální vývoj: aplikace + vlastní Azurite (blob 10200, tabulky 10202). Porty nekolidují s ToiletLabels (10100/10102)
# ani s FoxLordem (10000-10002). Tajné hodnoty se do kontejneru nepředávají celým souborem .env,
# jen vyjmenované proměnné z něj (viz .env.example).
name: baruchstreks

services:
  app:
    build:
      context: .
      dockerfile: src/BaruchsTreks/Dockerfile
    image: baruchstreks-app:local
    ports:
      - "127.0.0.1:8100:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Well-known účet Azurite (devstoreaccount1), veřejně zdokumentovaný klíč, žádné tajemství.
      ConnectionStrings__Storage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      # Základ ÚČTU (ne kontejneru) blobů, kterou vidí prohlížeč (aplikace se k Azurite připojuje přes http://azurite:10000).
      Storage__PublicBlobBaseUrl: http://localhost:10200/devstoreaccount1/
      Mapy__ApiKey: ${MAPY_API_KEY:-}
      # Prázdné heslo = uživatel se nezakládá.
      Admin__Users__0__UserName: ${ADMIN_USER_1:-}
      Admin__Users__0__Password: ${ADMIN_PASSWORD_1:-}
      Admin__Users__1__UserName: ${ADMIN_USER_2:-}
      Admin__Users__1__Password: ${ADMIN_PASSWORD_2:-}
      # Bez obou hodnot je import ze Stravy vypnutý.
      Strava__ClientId: ${STRAVA_CLIENT_ID:-}
      Strava__ClientSecret: ${STRAVA_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "dotnet", "BaruchsTreks.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s
    depends_on:
      - azurite

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose --location /data
    ports:
      - "127.0.0.1:10200:10000"
      - "127.0.0.1:10202:10002"
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
