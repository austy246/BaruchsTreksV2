      #       echo "Creating new App Service Plan: ${{ env.AZURE_APP_PLAN }}"
      #       az appservice plan create --name ${{ env.AZURE_APP_PLAN }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --sku F1 --is-linux
