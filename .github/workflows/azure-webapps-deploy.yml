      #     fi

      # # Configure Azure Web App
      # - name: Configure Azure Web App
      #   run: |
      #     # Set Python version
      #     az webapp config set --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_WEBAPP_NAME }} --linux-fx-version "PYTHON|3.12"
