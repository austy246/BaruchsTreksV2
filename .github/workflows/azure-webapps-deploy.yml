name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: b-treks    # Your Azure Web App name
  AZURE_RESOURCE_GROUP: BaruchsTreks  # Your Azure Resource Group name
  AZURE_APP_PLAN: b-treks-plan  # Your App Service Plan name
  PYTHON_VERSION: '3.12'             # Python version

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      # Install dependencies in venv
      - name: Install dependencies in venv
        run: |
          # pwd
          python -m pip install --upgrade pip
          python -m venv venv
          source ./venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      # Collect static files
      - name: Collect static files
        run: |
          # pwd
          source ./venv/bin/activate
          python manage.py collectstatic --noinput
        env:
          BARUCHSTREKS_STORAGE_CONNECTION: ${{ secrets.BARUCHSTREKS_STORAGE_CONNECTION }}
          MAPY_CZ_API_KEY: ${{ secrets.MAPY_CZ_API_KEY }}
      
      # Create deployment package
      - name: Prepare artifact for deployment
        run: |
          # List files to verify
          # ls -la
          # Create the zip file
          zip -r release.zip ./* -x "*.git*"
      
      # Upload artifact for deployment job
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read

    steps:
      # Download artifact from build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      # Log in to Azure with OIDC - the workflow requests a short-lived token
      # per run, so there is no client secret to expire. This job runs in the
      # 'Production' environment, so the federated credential in Azure must be
      # registered for the subject
      # repo:austy246/BaruchsTreksV2:environment:Production
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # # Create App Service Plan and Web App if they don't exist
      # - name: Create App Service Plan and Web App if they don't exist
