      #       echo "Creating new web app: ${{ env.AZURE_WEBAPP_NAME }}"
      #       az webapp create --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --plan ${{ env.AZURE_APP_PLAN }} --runtime "PYTHON:3.12"
      #     else
